name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    # Same host ports as local docker compose, so tests need no CI-specific configuration.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: slotwise, POSTGRES_PASSWORD: slotwise, POSTGRES_DB: slotwise }
        ports: ["55436:5432"]
        options: >-
          --health-cmd "pg_isready -U slotwise" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56383:6379"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["58025:8025", "51025:1025"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Create DB roles + test database (what docker-entrypoint-initdb.d does locally)
        env: { PGPASSWORD: slotwise }
        run: psql -h localhost -p 55436 -U slotwise -d slotwise -f docker/postgres/10-roles.sql
      - run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
      - name: Dependency vulnerabilities
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  image:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t slotwise:${{ github.sha }} .
      - name: Container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: slotwise:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
