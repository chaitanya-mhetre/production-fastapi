# Reverse proxy in front of uvicorn. TLS terminates here in production (see deploy/aws/README.md);
# locally it listens on plain HTTP.
worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    log_format json escape=json '{"ts":"$time_iso8601","request_id":"$request_id",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"upstream_ms":"$upstream_response_time"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # Coarse per-IP flood protection. Fine-grained per-tenant limits live in the app (Redis).
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;
    # Rejected requests get 429 (retry later), not Nginx's default 503. A 503 looks like an outage
    # to clients, load balancers and alerting, and invites aggressive retries. Found by the k6 run.
    limit_req_status 429;

    # Re-resolve container names at runtime. Without this, Nginx resolves `api` once at startup
    # and keeps sending traffic to the OLD container IP after every redeploy (502s).
    # `resolve` in an upstream needs a shared-memory zone, and open-source Nginx 1.27.3+.
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS

    upstream slotwise_api {
        zone slotwise_api 64k;
        server api:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;

        # Uploads go straight to S3 via presigned URLs, so API bodies are small JSON.
        client_max_body_size 1m;
        client_body_timeout 10s;   # drop slow-loris clients before they reach uvicorn
        client_header_timeout 10s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /metrics {
            # Prometheus scrapes from the private network only.
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://slotwise_api;
        }

        location / {
            limit_req zone=per_ip burst=100 nodelay;
            proxy_pass http://slotwise_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;  # the app reuses it: logs join up
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
